                    opacity: 1;
                }</style></noscript><script>document.addEventListener("DOMContentLoaded", () => {
  const WORKER_URL = "https://nodus-translate.bdada0602.workers.dev/";

  const titleEl = document.querySelector(".hero__content h1");
  const contentEl = document.querySelector(".content__entry");

  if (!titleEl || !contentEl) return;

  const originalTitle = titleEl.innerHTML;
  const originalContent = contentEl.innerHTML;

  const switcher = document.createElement("div");
  switcher.id = "nodus-language-switcher";
  switcher.innerHTML = `
    <button type="button" data-lang="tr" class="active">TR</button>
    <span>|</span>
    <button type="button" data-lang="en">EN</button>
  `;

  document.body.appendChild(switcher);

  const trButton = switcher.querySelector('[data-lang="tr"]');
  const enButton = switcher.querySelector('[data-lang="en"]');

  async function translateText(text) {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        text,
        targetLanguage: "English"
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Translation failed");
    }

    return data.translation;
  }

  async function translateToEnglish() {
    enButton.disabled = true;
    enButton.textContent = "...";

    try {
      const [translatedTitle, translatedContent] = await Promise.all([
        translateText(titleEl.innerText.trim()),
        translateText(contentEl.innerText.trim())
      ]);

      titleEl.textContent = translatedTitle;

      contentEl.innerHTML = "";

      const paragraphs = translatedContent
        .split(/\n\s*\n/)
        .filter(Boolean);

      paragraphs.forEach(text => {
        const p = document.createElement("p");
        p.textContent = text.trim();
        contentEl.appendChild(p);
      });

      enButton.classList.add("active");
      trButton.classList.remove("active");

    } catch (error) {
      console.error("NODUS translation error:", error);
      alert("İngilizce çeviri şu anda kullanılamıyor.");
    } finally {
      enButton.disabled = false;
      enButton.textContent = "EN";
    }
  }

  function restoreTurkish() {
    titleEl.innerHTML = originalTitle;
    contentEl.innerHTML = originalContent;

    trButton.classList.add("active");
    enButton.classList.remove("active");
  }

  enButton.addEventListener("click", translateToEnglish);
  trButton.addEventListener("click", restoreTurkish);
});</script><style>#nodus-language-switcher {

}

  border: 0;

}

  color: #C49A55;

}

  opacity: .6;

}
