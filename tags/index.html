                    opacity: 1;
                }</style></noscript><script>document.addEventListener("DOMContentLoaded", () => {

  const WORKER_URL =
    "https://nodus-translate.bdada0602.workers.dev/";

  const originalValues = new Map();
  let translating = false;

  /* ==========================
     NODUS SABİT ÇEVİRİLER
     ========================== */

  const dictionary = {
    "Ana Sayfa": "Home",
    "Analizler": "Analysis",
    "Konular": "Topics",
    "Yazarlar": "Authors",
    "Hakkımızda": "About",

    "Bilginin Egemenliği": "The Primacy of Knowledge",

    "Farklı disiplinlerden uzmanların katkılarıyla küresel ve bölgesel gelişmeleri anlamaya yönelik bağımsız analiz, yorum ve değerlendirmeler.":
      "Independent analysis, commentary and assessments aimed at understanding global and regional developments through contributions from experts across different disciplines.",

    "Son Analizler": "Latest Analysis",
    "Tüm Analizler": "All Analysis",

    "Devamını oku": "Read more",
    "Devamını oku…": "Read more",

    "Paylaş": "Share",
    "Önceki": "Previous",
    "Sonraki": "Next",

    "Ara": "Search",
    "Arama": "Search",

    "Yazar": "Author",
    "Yayın tarihi": "Published",

    "Bu yazı son olarak şu tarihte güncellendi":
      "This article was last updated on",

    "Dış Politika & Diplomasi":
      "Foreign Policy & Diplomacy",

    "Jeopolitik & Strateji":
      "Geopolitics & Strategy"
  };


  /* ==========================
     TR | EN BUTONU
     ========================== */

  const switcher = document.createElement("div");

  switcher.id = "nodus-language-switcher";

  switcher.innerHTML = `
    <button type="button" data-lang="tr">TR</button>
    <span>|</span>
    <button type="button" data-lang="en">EN</button>
  `;

  document.body.appendChild(switcher);

  const trButton =
    switcher.querySelector('[data-lang="tr"]');

  const enButton =
    switcher.querySelector('[data-lang="en"]');


  /* ==========================
     YARDIMCI FONKSİYONLAR
     ========================== */

  function remember(element, type = "text") {

    if (originalValues.has(element)) return;

    originalValues.set(element, {
      type,
      value:
        type === "html"
          ? element.innerHTML
          : element.textContent
    });

  }


  function replaceExactText(element, from, to) {

    const walker = document.createTreeWalker(
      element,
      NodeFilter.SHOW_TEXT
    );

    let node;

    while ((node = walker.nextNode())) {

      if (node.nodeValue.trim() === from) {

        if (!node.__nodusOriginal) {
          node.__nodusOriginal = node.nodeValue;
        }

        const leading =
          node.nodeValue.match(/^\s*/)?.[0] || "";

        const trailing =
          node.nodeValue.match(/\s*$/)?.[0] || "";

        node.nodeValue =
          leading + to + trailing;
      }
    }
  }


  /* ==========================
     SABİT ARAYÜZ ÇEVİRİSİ
     ========================== */

  function translateStaticInterface() {

    Object.entries(dictionary).forEach(
      ([tr, en]) => {

        document
          .querySelectorAll(
            "a, button, span, h1, h2, h3, h4, p, li"
          )
          .forEach(element => {

            if (
              element.closest(
                "#nodus-language-switcher"
              )
            ) {
              return;
            }

            replaceExactText(
              element,
              tr,
              en
            );

          });

      }
    );

    translateDates();

    document.documentElement.lang = "en";
  }


  function restoreStaticInterface() {

    const walker = document.createTreeWalker(
      document.body,
      NodeFilter.SHOW_TEXT
    );

    let node;

    while ((node = walker.nextNode())) {

      if (node.__nodusOriginal !== undefined) {
        node.nodeValue =
          node.__nodusOriginal;
      }

    }

    document.documentElement.lang = "tr";
  }


  /* ==========================
     TARİHLER
     ========================== */

  const months = {
    "Ocak": "January",
    "Şubat": "February",
    "Mart": "March",
    "Nisan": "April",
    "Mayıs": "May",
    "Haziran": "June",
    "Temmuz": "July",
    "Ağustos": "August",
    "Eylül": "September",
    "Ekim": "October",
    "Kasım": "November",
    "Aralık": "December"
  };


  function translateDates() {

    document
      .querySelectorAll("time, .feed__date")
      .forEach(element => {

        if (!element.__nodusOriginalText) {
          element.__nodusOriginalText =
            element.textContent;
        }

        let text = element.textContent;

        Object.entries(months).forEach(
          ([tr, en]) => {
            text = text.replace(tr, en);
          }
        );

        element.textContent = text;

      });

  }


  function restoreDates() {

    document
      .querySelectorAll("time, .feed__date")
      .forEach(element => {

        if (element.__nodusOriginalText) {
          element.textContent =
            element.__nodusOriginalText;
        }

      });

  }


  /* ==========================
     GROQ
     ========================== */

  async function groqTranslate(text) {

    const clean = text.trim();

    if (!clean) return clean;

    const cacheKey =
      "nodus-en-" +
      simpleHash(clean);

    const cached =
      localStorage.getItem(cacheKey);

    if (cached) {
      return cached;
    }

    const response =
      await fetch(WORKER_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          text: clean,
          targetLanguage: "English"
        })

      });

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Translation failed"
      );
    }

    localStorage.setItem(
      cacheKey,
      data.translation
    );

    return data.translation;
  }


  function simpleHash(str) {

    let hash = 0;

    for (
      let i = 0;
      i < str.length;
      i++
    ) {

      hash =
        ((hash << 5) - hash) +
        str.charCodeAt(i);

      hash |= 0;

    }

    return hash.toString();
  }


  /* ==========================
     MAKALE SAYFASI
     ========================== */

  async function translateArticlePage() {

    const title =
      document.querySelector(
        ".hero__content h1"
      );

    const content =
      document.querySelector(
        ".content__entry"
      );

    if (!title || !content) return;

    remember(title);
    remember(content, "html");

    const titleTranslation =
      await groqTranslate(
        title.textContent
      );

    title.textContent =
      titleTranslation;


    const blocks =
      content.querySelectorAll(
        "p, h2, h3, h4, blockquote, li"
      );


    for (const block of blocks) {

      const text =
        block.textContent.trim();

      if (text.length < 2) {
        continue;
      }

      if (!block.__nodusOriginalHTML) {
        block.__nodusOriginalHTML =
          block.innerHTML;
      }

      const translated =
        await groqTranslate(text);

      block.textContent =
        translated;
    }

  }


  /* ==========================
     ANA SAYFA YAZI BAŞLIKLARI
     ========================== */

  async function translateHomepagePosts() {

    /*
      Makale sayfasındaysak
      ana sayfa kartlarını arama.
    */

    if (
      document.querySelector(
        ".content__entry"
      )
    ) {
      return;
    }


    /*
      SADECE BURASI DÜZELTİLDİ.

      Senin verdiğin gerçek HTML:

      <h2 class="editorial-card__title">
        <a href="...">Başlık</a>
      </h2>
    */

    const links = Array.from(
      document.querySelectorAll(
        "h2.editorial-card__title > a"
      )
    );


    for (const link of links) {

      const text =
        link.textContent.trim();

      if (
        text.length < 15 ||
        text === "Read more"
      ) {
        continue;
      }

      if (
        !link.__nodusOriginalText
      ) {
        link.__nodusOriginalText =
          link.textContent;
      }

      try {

        link.textContent =
          await groqTranslate(text);

      }
      catch (error) {

        console.error(
          "NODUS title translation:",
          error
        );

      }

    }


    const excerpts =
      document.querySelectorAll(
        ".feed__excerpt, .post__excerpt"
      );


    for (const excerpt of excerpts) {

      const text =
        excerpt.textContent.trim();

      if (text.length < 20) continue;

      if (
        !excerpt.__nodusOriginalText
      ) {
        excerpt.__nodusOriginalText =
          excerpt.textContent;
      }

      try {

        excerpt.textContent =
          await groqTranslate(text);

      }
      catch (error) {

        console.error(
          "NODUS excerpt translation:",
          error
        );

      }

    }

  }


  /* ==========================
     ENGLISH MODE
     ========================== */

  async function enableEnglish() {

    if (translating) return;

    translating = true;

    enButton.disabled = true;
    enButton.textContent = "...";

    try {

      translateStaticInterface();

      await Promise.all([
        translateArticlePage(),
        translateHomepagePosts()
      ]);

      localStorage.setItem(
        "nodus-language",
        "en"
      );

      enButton.classList.add(
        "active"
      );

      trButton.classList.remove(
        "active"
      );

    }

    catch (error) {

      console.error(
        "NODUS translation error:",
        error
      );

      alert(
        "English translation is currently unavailable."
      );

    }

    finally {

      translating = false;

      enButton.disabled = false;
      enButton.textContent = "EN";

    }

  }


  /* ==========================
     TÜRKÇE MOD
     ========================== */

  function enableTurkish() {

    restoreStaticInterface();
    restoreDates();


    originalValues.forEach(
      (stored, element) => {

        if (!document.contains(element)) {
          return;
        }

        if (stored.type === "html") {
          element.innerHTML =
            stored.value;
        }
        else {
          element.textContent =
            stored.value;
        }

      }
    );


    /*
      Ana sayfa kart başlıklarını
      orijinal Türkçeye döndür.
    */

    document
      .querySelectorAll(
        "h2.editorial-card__title > a"
      )
      .forEach(element => {

        if (
          element.__nodusOriginalText
        ) {
          element.textContent =
            element.__nodusOriginalText;
        }

      });


    document
      .querySelectorAll(
        ".feed__excerpt, .post__excerpt"
      )
      .forEach(element => {

        if (
          element.__nodusOriginalText
        ) {
          element.textContent =
            element.__nodusOriginalText;
        }

      });


    localStorage.setItem(
      "nodus-language",
      "tr"
    );

    trButton.classList.add(
      "active"
    );

    enButton.classList.remove(
      "active"
    );

  }


  /* ==========================
     BUTONLAR
     ========================== */

  enButton.addEventListener(
    "click",
    enableEnglish
  );

  trButton.addEventListener(
    "click",
    enableTurkish
  );


  /* ==========================
     DİLİ HATIRLA
     ========================== */

  const savedLanguage =
    localStorage.getItem(
      "nodus-language"
    );


  if (savedLanguage === "en") {

    enableEnglish();

  }
  else {

    trButton.classList.add(
      "active"
    );

  }

});</script><style>#nodus-language-switcher {
